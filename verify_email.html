cat > /var/www/html/icook/verify_email.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подтверждение email — Я готовлю</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);color:#0f172a;padding:20px;}
.box{text-align:center;max-width:450px;padding:40px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,255,213,0.15);border:2px solid rgba(0,255,213,0.2);}
.icon{font-size:64px;margin-bottom:20px;}
h1{font-size:28px;font-weight:800;color:#00b8a3;margin-bottom:12px;}
p{color:#475569;line-height:1.6;margin-bottom:24px;font-size:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 32px;border:none;border-radius:14px;background:linear-gradient(135deg,#00ffd5,#7fffd4,#00e6c2);color:#003d33;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:0.3s;}
.btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,255,213,0.6);}
.error{color:#ef4444;font-weight:600;}
.success{color:#10b981;font-weight:600;}
.loader{display:inline-block;width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#00b8a3;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="box" id="content">
<div class="loader"></div>
<p>Проверяем ссылку...</p>
</div>
<script>
(async function(){
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const box = document.getElementById('content');

if(!token){
box.innerHTML = '<div class="icon">❌</div><h1>Ошибка</h1><p class="error">Ссылка недействительна</p><a href="index.html" class="btn">На главную</a>';
return;
}

try{
const res = await fetch('/api/verify_token.php?token='+token);
const data = await res.json();

if(data.error){
box.innerHTML = '<div class="icon">⚠️</div><h1>Ошибка</h1><p class="error">'+data.error+'</p><a href="index.html" class="btn">На главную</a>';
return;
}

box.innerHTML = '<div class="icon">✅</div><h1>Email подтверждён!</h1><p class="success">Теперь вы можете войти в аккаунт</p><a href="index.html" class="btn">Перейти ко входу</a>';
}catch(e){
box.innerHTML = '<div class="icon">❌</div><h1>Ошибка</h1><p class="error">Не удалось подключиться к серверу</p><a href="index.html" class="btn">На главную</a>';
}
})();
</script>
</body>
</html>
