<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Админ-панель — Я готовлю</title>
<link rel="stylesheet" href="assets/css/app.css?v=20261125230329">
<link rel="stylesheet" href="assets/css/site-fonts.css?v=20261105152159">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text-main);font-family:'Nunito',sans-serif}
.admin-topbar{position:relative;z-index:5;display:flex;align-items:center;gap:12px;width:100%;height:64px;flex:none;padding:0 18px;border-bottom:1px solid var(--border-color);background:var(--card-bg);box-shadow:0 2px 12px rgba(15,23,42,.06)}
.admin-topbar-button{display:grid;place-items:center;width:42px;height:42px;flex:none;border:1px solid var(--border-color);border-radius:12px;background:var(--card-bg);color:var(--text-main);cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.admin-topbar-button:hover{transform:translateY(-1px);border-color:var(--neon);background:var(--neon-glow)}
.admin-topbar-button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.admin-topbar-title{min-width:0;margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px}
.admin-topbar-context{color:var(--text-muted);font-size:12px;font-weight:700}
.admin-theme-button{width:42px;height:42px;flex:none;margin-left:auto}
.admin-page-frame{display:block;width:100%;min-height:0;flex:1;border:0;background:var(--bg)}
@media(max-width:600px){.admin-topbar{height:58px;gap:9px;padding:0 12px}.admin-topbar-button{width:38px;height:38px;border-radius:11px}.admin-theme-button{width:38px;height:38px;border-radius:11px}.admin-topbar-title{font-size:14px}.admin-topbar-context{display:none}}
</style>
<script>
(function(){var theme=localStorage.getItem('site-theme');document.documentElement.setAttribute('data-theme',theme==='dark'?'dark':'light');})();
</script>
</head>
<body>
<header class="admin-topbar">
    <button class="admin-topbar-button" id="adminMenuButton" type="button" aria-label="Свернуть боковую панель" aria-expanded="true" title="Свернуть/показать меню">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="admin-topbar-button" id="adminBackButton" type="button" aria-label="Вернуться в профиль" title="Вернуться в профиль">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1 class="admin-topbar-title">Панель администратора</h1>
    <span class="admin-topbar-context" id="adminTopbarContext">Обзор и статистика</span>
    <button class="icon-btn theme-btn admin-theme-button" id="adminThemeButton" type="button" aria-label="Переключить тему" title="Переключить светлую/тёмную тему">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
</header>
<iframe class="admin-page-frame" id="adminPageFrame" src="profile.html?admin=1&amp;v=20261123-admin-user-field-name13" title="Панель администратора"></iframe>
<script>
(function(){
    var frame=document.getElementById('adminPageFrame');
    var menuButton=document.getElementById('adminMenuButton');
    var themeButton=document.getElementById('adminThemeButton');
    var context=document.getElementById('adminTopbarContext');
    var currentSection='stats';
    var currentReviewStatus='pending';
    var historyReady=false;

    function adminHistoryState(section,reviewStatus){
        return Object.assign({},history.state&&typeof history.state==='object'?history.state:{},{
            __adminPanelHistory:true,
            adminPanelSection:section||'stats',
            adminPanelReviewStatus:reviewStatus||'pending'
        });
    }
    function pushAdminHistory(){
        try{history.pushState(adminHistoryState(currentSection,currentReviewStatus),'',location.href);}
        catch(error){}
    }
    function navigateFrame(section,reviewStatus){
        if(!frame.contentWindow)return;
        frame.contentWindow.postMessage({
            type:'admin-traverse-section',
            section:section||'stats',
            reviewStatus:reviewStatus||'pending'
        },location.origin);
    }
    function applyTheme(theme){
        var next=theme==='dark'?'dark':'light';
        document.documentElement.setAttribute('data-theme',next);
        localStorage.setItem('site-theme',next);
        try{
            var frameDoc=getFrameDocument();
            if(frameDoc)frameDoc.documentElement.setAttribute('data-theme',next);
        }catch(error){}
    }
    themeButton.addEventListener('click',function(){
        applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
    });

    pushAdminHistory();
    historyReady=true;
    window.addEventListener('popstate',function(event){
        var state=event.state;
        if(state&&state.__adminPanelHistory){
            currentSection=state.adminPanelSection||'stats';
            currentReviewStatus=state.adminPanelReviewStatus||'pending';
            navigateFrame(currentSection,currentReviewStatus);
            return;
        }
        // Keep the browser's edge-swipe/back action inside the admin workspace.
        pushAdminHistory();
    });

    function getFrameDocument(){
        try{return frame.contentDocument||frame.contentWindow.document;}catch(error){return null;}
    }
    function updateMenuState(){
        var doc=getFrameDocument();
        if(!doc)return;
        var open=doc.body.classList.contains('admin-sidebar-open');
        var collapsed=doc.body.classList.contains('admin-sidebar-collapsed');
        var mobile=window.matchMedia('(max-width:760px)').matches;
        var expanded=mobile?open:!collapsed;
        menuButton.setAttribute('aria-expanded',String(expanded));
        menuButton.setAttribute('aria-label',expanded?'Свернуть боковую панель':'Показать боковую панель');
    }
    menuButton.addEventListener('click',function(){
        var doc=getFrameDocument();
        if(!doc)return;
        if(window.matchMedia('(max-width:760px)').matches){
            doc.body.classList.toggle('admin-sidebar-open');
        }else{
            doc.body.classList.toggle('admin-sidebar-collapsed');
        }
        updateMenuState();
    });
    document.getElementById('adminBackButton').addEventListener('click',function(){
        window.location.href='profile.html';
    });
    frame.addEventListener('load',function(){
        var doc=getFrameDocument();
        if(!doc)return;
        doc.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light');
        if(/\/index\.html$/.test(frame.contentWindow.location.pathname)){
            window.location.href='index.html?auth=login';
            return;
        }
        var title=doc.getElementById('adminSectionTitle');
        if(title){
            context.textContent=title.textContent;
            new MutationObserver(function(){context.textContent=title.textContent;}).observe(title,{childList:true,characterData:true,subtree:true});
        }
        updateMenuState();
    });
    window.addEventListener('message',function(event){
        if(event.origin!==location.origin||!event.data)return;
        if(event.data.type==='admin-sidebar-changed'){updateMenuState();return;}
        if(event.data.type==='admin-section-change'){
            var nextSection=event.data.section||'stats';
            var nextReviewStatus=event.data.reviewStatus||'pending';
            if(nextSection===currentSection&&nextReviewStatus===currentReviewStatus)return;
            currentSection=nextSection;
            currentReviewStatus=nextReviewStatus;
            if(historyReady)pushAdminHistory();
            return;
        }
        if(event.data.type!=='admin-access-denied')return;
        window.location.href='profile.html';
    });
})();
</script>
<script src="assets/js/modal-back.js?v=20261120145819" defer></script>
</body>
</html>
