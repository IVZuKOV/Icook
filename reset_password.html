<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сброс пароля — Я готовлю</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);color:#0f172a;padding:20px;}
.box{text-align:center;max-width:450px;width:100%;padding:40px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,255,213,0.15);border:2px solid rgba(0,255,213,0.2);}
.icon{font-size:64px;margin-bottom:20px;}
h1{font-size:28px;font-weight:800;color:#00b8a3;margin-bottom:12px;}
p{color:#475569;line-height:1.6;margin-bottom:24px;font-size:16px;}
input{width:100%;padding:16px;margin-bottom:16px;border-radius:14px;border:2px solid #e2e8f0;font-size:16px;outline:none;transition:0.3s;}
input:focus{border-color:#00ffd5;box-shadow:0 0 0 4px rgba(0,255,213,0.15);}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#00ffd5,#7fffd4,#00e6c2);color:#003d33;font-weight:700;font-size:16px;cursor:pointer;transition:0.3s;text-decoration:none;}
.btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,255,213,0.6);}
.error{color:#ef4444;font-size:13px;min-height:18px;margin-bottom:8px;text-align:left;}
.success{color:#10b981;font-weight:600;}
.loader{display:inline-block;width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#00b8a3;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.link{display:inline-block;margin-top:16px;color:#00b8a3;font-weight:600;text-decoration:none;}
.link:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="box" id="content">
<div class="loader"></div>
<p>Проверяем ссылку...</p>
</div>
<script>
(async function(){
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const box = document.getElementById('content');

if(!token){
box.innerHTML = '<div class="icon">❌</div><h1>Ошибка</h1><p style="color:#ef4444;">Ссылка недействительна</p><a href="index.html" class="link">На главную</a>';
return;
}

// Проверяем токен
try{
const res = await fetch('/api/verify_token.php?token='+token);
const data = await res.json();
if(data.error){
box.innerHTML = '<div class="icon">⚠️</div><h1>Ошибка</h1><p style="color:#ef4444;">'+data.error+'</p><a href="index.html" class="link">На главную</a>';
return;
}
}catch(e){
box.innerHTML = '<div class="icon">❌</div><h1>Ошибка</h1><p style="color:#ef4444;">Не удалось подключиться к серверу</p><a href="index.html" class="link">На главную</a>';
return;
}

// Показываем форму нового пароля
box.innerHTML = '<div class="icon">🔐</div><h1>Новый пароль</h1><p>Введите новый пароль для аккаунта</p><div class="error" id="err"></div><input type="password" id="pass1" placeholder="Новый пароль (мин. 8 символов)"><input type="password" id="pass2" placeholder="Повторите пароль"><button class="btn" id="submitBtn">Сохранить пароль</button><a href="index.html" class="link">На главную</a>';

document.getElementById('submitBtn').onclick = async function(){
const p1 = document.getElementById('pass1').value;
const p2 = document.getElementById('pass2').value;
const err = document.getElementById('err');
err.textContent = '';

if(p1.length < 8){ err.textContent = 'Минимум 8 символов'; return; }
if(p1 !== p2){ err.textContent = 'Пароли не совпадают'; return; }

this.textContent = 'Сохраняем...';
this.disabled = true;

try{
const res = await fetch('/api/set_new_password.php',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({token:token, password:p1})
});
const data = await res.json();
if(data.error){ err.textContent = data.error; this.textContent = 'Сохранить пароль'; this.disabled = false; return; }
box.innerHTML = '<div class="icon">✅</div><h1>Пароль изменён!</h1><p class="success">Теперь вы можете войти с новым паролем</p><a href="index.html" class="btn">Перейти ко входу</a>';
}catch(e){
err.textContent = 'Ошибка подключения';
this.textContent = 'Сохранить пароль';
this.disabled = false;
}
};
})();
</script>
</body>
</html>
