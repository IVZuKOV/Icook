.site-header{width:100%;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);background:var(--header-bg);border-bottom:1px solid var(--border-color);box-shadow:0 4px 30px rgba(30,64,175,.1)}

@keyframes logoPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px var(--neon)) drop-shadow(0 0 20px rgba(30,64,175,.6))}50%{transform:scale(1.06);filter:drop-shadow(0 0 15px var(--neon)) drop-shadow(0 0 35px rgba(30,64,175,.8)) drop-shadow(0 0 50px rgba(59,130,246,.4))}}

.back-to-top{position:fixed;bottom:70px;right:16px;z-index:102;width:40px;height:40px;padding:0;border:0;border-radius:12px;background:var(--card-bg);color:var(--neon);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s,box-shadow .3s;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--neon),0 0 14px var(--neon-glow)}

<script>
(function(){
    const params=new URLSearchParams(location.search);
    const type=params.get('type');
    const id=params.get('id')||'';
    const container=document.getElementById('favoriteDetail');
    const validTypes=['dish','recipe','place'];
    const fallbackImages={dish:'/assets/images/default-dishes/noodles.jpg',recipe:'/assets/images/default-dishes/noodles.jpg'};
    function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el;}
    function section(title){const wrap=node('section','detail-section');wrap.appendChild(node('h2','',title));return wrap;}
    function safeExternalUrl(value){try{const url=new URL(value,location.origin);return ['http:','https:','mailto:','tel:'].includes(url.protocol)?url.href:''}catch(e){return ''}}
    function parseArray(value){if(Array.isArray(value))return value;if(typeof value==='string'){try{const parsed=JSON.parse(value);return Array.isArray(parsed)?parsed:[]}catch(e){return []}}return []}
    function imageUrl(path,fallback){return typeof path==='string'&&path.trim()?path:fallback}
    function readCart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){return []}}
    function writeCart(cart){localStorage.setItem('cart',JSON.stringify(cart));if(typeof window.updateCartBadge==='function')window.updateCartBadge()}
    function showCartToast(name){if(typeof window.showToast==='function')window.showToast(name+' добавлен в корзину')}
    function makeCartButton(item){
        const button=node('button','detail-button cart-add-btn','В корзину');
        button.type='button';
        button.addEventListener('click',function(){
            const cart=readCart();
            const existing=cart.find(function(row){return String(row.id)===String(item.id)});
            if(existing)existing.qty=(Number(existing.qty)||1)+1;
            else cart.push({id:Number(item.id),name:item.title||'',chef:item.seller_name||'Повар',price:Number(item.price),img:item.image||'',qty:1});
            writeCart(cart);
            showCartToast(item.title||'Блюдо');
            button.replaceWith(renderCartQuantity(item));
        });
        return button;
    }
    function renderCartQuantity(item){
        const old=document.getElementById('detailCartControl');
        if(old)old.remove();
        const cart=readCart();
        const inCart=cart.find(function(row){return String(row.id)===String(item.id)});
        if(!inCart||Number(inCart.qty)<1)return;
        const control=node('div','qty-control detail-qty-control');
        control.id='detailCartControl';
        const minus=node('button','qty-btn','−');
        minus.type='button';minus.setAttribute('aria-label','Уменьшить количество');
        const value=node('span','qty-val',String(inCart.qty));
        const plus=node('button','qty-btn','+');
        plus.type='button';plus.setAttribute('aria-label','Увеличить количество');
        minus.addEventListener('click',function(){
            const rows=readCart();
            const row=rows.find(function(entry){return String(entry.id)===String(item.id)});
            if(!row)return;
            row.qty=(Number(row.qty)||1)-1;
            if(row.qty<=0){
                writeCart(rows.filter(function(entry){return String(entry.id)!==String(item.id)}));
                control.replaceWith(makeCartButton(item));
            }else{
                writeCart(rows);value.textContent=String(row.qty);
            }
        });
        plus.addEventListener('click',function(){
            const rows=readCart();
            const row=rows.find(function(entry){return String(entry.id)===String(item.id)});
            if(!row)return;
            row.qty=(Number(row.qty)||1)+1;writeCart(rows);value.textContent=String(row.qty);
            showCartToast(item.title||'Блюдо');
        });
        control.append(minus,value,plus);
        return control;
    }
    function addHeader(item,label){
        const body=node('div','detail-body');
        body.appendChild(node('div','detail-kind',label));
        body.appendChild(node('h1','detail-title',item.title||item.name||'Подробнее'));
        return body;
    }
    function renderDish(item){
        const body=addHeader(item,'Блюдо');
        const author=node('div','detail-author');
        author.appendChild(window.IcookAuthorAvatar.create(item.seller_name||'Повар',item.seller_avatar,item.seller_avatar_version,item.seller_avatar_crop));
        author.appendChild(node('span','',item.seller_name||'Повар'));
        body.appendChild(author);
        const meta=node('div','detail-meta');
        if(item.category_name)meta.appendChild(node('span','',item.category_name));
        if(item.weight)meta.appendChild(node('span','',String(item.weight)+' г'));
        if(Number(item.price)>0)meta.appendChild(node('span','',Number(item.price).toLocaleString('ru-RU')+' ₽'));
        body.appendChild(meta);
        body.appendChild(node('div','detail-description',item.description||'Подробное описание блюда пока не добавлено.'));
        const actions=node('div','detail-actions');
        if(Number(item.price)>0){const cart=readCart();const existing=cart.find(function(row){return String(row.id)===String(item.id)});actions.appendChild(existing&&Number(existing.qty)>0?renderCartQuantity(item):makeCartButton(item))}
        if(actions.childElementCount)body.appendChild(actions);
        renderCard(item,body,'dish');
    }
    function renderRecipe(item){
        const body=addHeader(item,'Рецепт');
        const author=node('div','detail-author');
        author.appendChild(window.IcookAuthorAvatar.create(item.author_name||'Автор',item.author_avatar,item.author_avatar_version,item.author_avatar_crop));
        author.appendChild(node('span','',item.author_name||'Автор'));body.appendChild(author);
        if(item.category_name)body.appendChild(node('div','detail-meta')).appendChild(node('span','',item.category_name));
        body.appendChild(node('div','detail-description',item.description||'Подробное описание рецепта пока не добавлено.'));
        const ingredients=parseArray(item.ingredients);
        if(ingredients.length){const block=section('Ингредиенты');const list=node('ul','detail-list');ingredients.forEach(function(ingredient){const name=typeof ingredient==='string'?ingredient:[ingredient.name,ingredient.qty,ingredient.unit].filter(Boolean).join(' ');if(name)list.appendChild(node('li','',name))});block.appendChild(list);body.appendChild(block)}
        const steps=parseArray(item.steps);
        if(steps.length){const block=section('Приготовление');steps.forEach(function(step,index){const row=node('article','recipe-step');row.appendChild(node('span','recipe-step-number',String(index+1)));row.appendChild(node('div','recipe-step-text',step.text||step.description||''));const pictures=Array.isArray(step.images)?step.images:(step.image?[step.image]:[]);pictures.forEach(function(path){if(typeof path!=='string'||!path)return;const pic=node('img');pic.src=path;pic.alt='Фото шага '+(index+1);pic.loading='lazy';row.appendChild(pic)});block.appendChild(row)});body.appendChild(block)}
        renderCard(item,body,'recipe');
    }
    function renderPlace(item){
        const body=addHeader(item,'Место');
        const meta=node('div','detail-meta');
        if(item.type)meta.appendChild(node('span','',item.type));
        if(item.distance)meta.appendChild(node('span','',item.distance));
        if(meta.childElementCount)body.appendChild(meta);
        if(item.address)body.appendChild(node('div','detail-description','Адрес: '+item.address));
        const actions=node('div','detail-actions');
        [['website','Открыть сайт'],['phone','Позвонить'],['email','Написать']].forEach(function(pair){const url=item[pair[0]]?safeExternalUrl(pair[0]==='phone'?'tel:'+item[pair[0]]:pair[0]==='email'?'mailto:'+item[pair[0]]:item[pair[0]]):'';if(url){const link=node('a','detail-button secondary',pair[1]);link.href=url;link.target=/^https?:/.test(url)?'_blank':'';if(link.target)link.rel='noopener noreferrer';actions.appendChild(link)}});
        if(item.address){const map=node('a','detail-button secondary','На карте');map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(item.address);map.target='_blank';map.rel='noopener noreferrer';actions.appendChild(map)}
        body.appendChild(actions);
        renderCard(item,body,'place');
    }
    function renderCard(item,body,kind){
        container.replaceChildren();
        const src=imageUrl(item.image,kind==='place'&&window.IcookDefaultPlaceImage?window.IcookDefaultPlaceImage.random():(fallbackImages[kind]||''));
        if(src){const picture=node('img','detail-image');picture.src=src;picture.alt=item.title||item.name||'';picture.onerror=function(){this.onerror=null;if(fallbackImages[kind])this.src=fallbackImages[kind];else this.remove()};picture.loading='eager';container.appendChild(picture)}
        container.appendChild(body);
    }
    async function load(){
        if(!validTypes.includes(type)||!id){container.innerHTML='<div class="detail-state">Не удалось определить избранный материал.</div>';return}
        const entry=window.getFavoriteContent().find(function(row){return row.type===type&&String(row.id)===id});
        try{
            if(type==='place'){
                let placeItem=null;
                try{placeItem=JSON.parse(sessionStorage.getItem('icook-place-detail-'+id)||'null');sessionStorage.removeItem('icook-place-detail-'+id)}catch(e){}
                if(!placeItem)placeItem=entry&&entry.item;
                if(!placeItem)throw new Error('Не удалось загрузить информацию о месте.');
                renderPlace(placeItem);document.title=(placeItem.name||'Подробнее')+' — Я готовлю — ты ешь!';return;
            }
            const endpoint=type==='dish'?'/api/dishes.php?ids=':'/api/recipes.php?ids=';
            const response=await fetch(endpoint+encodeURIComponent(id),{cache:'no-store'});
            if(!response.ok)throw new Error('Не удалось загрузить подробную информацию.');
            const data=await response.json();
            const list=type==='dish'?data.dishes:data.recipes;
            const item=Array.isArray(list)&&list[0];
            if(!data.success||!item)throw new Error('Материал не найден или больше недоступен.');
            type==='dish'?renderDish(item):renderRecipe(item);
            document.title=(item.title||'Подробнее')+' — Я готовлю — ты ешь!';
        }catch(error){container.innerHTML='';container.appendChild(node('div','detail-state',error.message||'Не удалось загрузить материал.'))}
    }
    load();
})();
</script>
