<style>
:root{--neon:#1e40af;--neon-dark:#1e3a8a;--neon-glow:rgba(30,64,175,.12);--bg:#fff;--text-main:#1e293b;--text-muted:#64748b;--card-bg:#f8fafc;--header-bg:rgba(255,255,255,.96);--border-color:rgba(30,64,175,.15)}
[data-theme=dark]{--neon:#fff;--neon-dark:#e2e8f0;--neon-glow:rgba(255,255,255,.14);--bg:#0f172a;--text-main:#f8fafc;--text-muted:#94a3b8;--card-bg:#1e293b;--header-bg:rgba(15,23,42,.96);--border-color:rgba(255,255,255,.15)}
*{box-sizing:border-box}body{margin:0;padding-bottom:88px;background:var(--bg);color:var(--text-main);font:15px/1.5 'Rubik','Nunito',sans-serif}
.site-header{padding:16px 40px;display:flex;align-items:center;position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-color);box-shadow:0 4px 30px rgba(30,64,175,.1)}
.header-left{display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:12px;color:var(--neon-dark);font-size:clamp(16px,3.5vw,28px);font-weight:800;text-shadow:0 0 8px rgba(30,64,175,.4),0 0 20px rgba(30,64,175,.2);white-space:nowrap}
.logo-icon{width:44px;height:44px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(30,64,175,1)) drop-shadow(0 0 20px rgba(30,64,175,.6));animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px var(--neon)) drop-shadow(0 0 20px rgba(30,64,175,.6))}50%{transform:scale(1.06);filter:drop-shadow(0 0 15px var(--neon)) drop-shadow(0 0 35px rgba(30,64,175,.8)) drop-shadow(0 0 50px rgba(59,130,246,.4))}}
@keyframes logoPulseDark{0%,100%{transform:scale(1);filter:brightness(0) invert(1) drop-shadow(0 0 8px rgba(255,255,255,.5))}50%{transform:scale(1.06);filter:brightness(0) invert(1) drop-shadow(0 0 15px rgba(255,255,255,.7))}}
[data-theme="dark"] .logo{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.5),0 0 25px rgba(255,255,255,.25)}
[data-theme="dark"] .logo-icon{animation:logoPulseDark 3s ease-in-out infinite}
.bottom-bar{height:56px;min-height:56px;max-height:56px;position:fixed;bottom:0;left:0;right:0;z-index:100;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(16px);background:var(--header-bg);border-top:1px solid var(--border-color);box-shadow:0 -4px 30px rgba(30,64,175,.1)}
.bottom-bar .header-right{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:nowrap}
.bottom-bar .catalog-btn,.bottom-bar .icon-btn,.bottom-bar .user-btn-wrap{width:40px;height:40px;min-width:40px;background:transparent;border:0;border-radius:50%;box-shadow:none;color:var(--neon-dark);display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.bottom-bar .catalog-btn:hover,.bottom-bar .icon-btn:hover{background:var(--neon-glow);transform:scale(1.05)}
.bottom-bar .user-btn-letter{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;font-weight:800}
.bottom-bar svg{width:20px;height:20px}
.catalog-overlay{position:fixed;inset:0;z-index:998;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.catalog-overlay.active{opacity:1;pointer-events:auto}
.catalog-drawer{position:fixed;top:0;left:0;z-index:999;width:min(320px,100vw);height:100vh;height:100dvh;padding:28px 20px;overflow-y:auto;background:var(--card-bg);transform:translateX(-100%);transition:transform .4s cubic-bezier(.25,.8,.25,1)}
.catalog-drawer.active{transform:translateX(0)}
[data-theme="dark"] .site-header{background:rgba(11,17,32,.98)}
.export-btn{min-height:40px;padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-color);border-radius:11px;background:var(--card-bg);color:var(--text-main);font:700 13px 'Rubik',sans-serif;cursor:pointer}
.export-btn:hover{border-color:var(--neon);background:var(--neon-glow)}
.excel-mark{width:25px;height:25px;display:grid;place-items:center;border-radius:5px;background:#168447;color:#fff;font-weight:800;font-size:15px;box-shadow:inset -4px 0 rgba(0,0,0,.12)}
.manage-page{max-width:1500px;margin:0 auto;padding:28px clamp(12px,3vw,32px) 60px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.page-heading h1{margin:0;color:var(--neon-dark);font-size:clamp(24px,4vw,34px);line-height:1.2}
.page-heading p{margin:6px 0 0;color:var(--text-muted);font-size:14px}
.bulk-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:12px;border:1px solid var(--border-color);border-radius:14px;background:var(--card-bg)}
.selection-count{margin-right:auto;color:var(--text-muted);font-size:13px}
.selection-summary{display:flex;align-items:center;gap:12px;margin-right:auto}
.selection-summary .selection-count{margin-right:0}
.clear-selection{padding:4px 0;border:0;background:transparent;color:#1e40af;font:700 13px 'Rubik',sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
[data-theme="dark"] .clear-selection{color:var(--text-muted)}
.bulk-toolbar select{min-width:185px;min-height:40px;padding:8px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg);color:var(--text-main);font:600 13px 'Rubik',sans-serif}
.apply-status{min-height:40px;padding:8px 14px;border:0;border-radius:10px;background:var(--neon);color:#fff;font:700 13px 'Rubik',sans-serif;cursor:pointer}
.apply-status:disabled{opacity:.45;cursor:not-allowed}
[data-theme="dark"] .apply-status{background:#1e293b;color:#f8fafc;border:1px solid rgba(255,255,255,.45);box-shadow:none}
[data-theme="dark"] .apply-status:hover:not(:disabled){background:#334155;box-shadow:none}
.table-scroll{max-height:calc(100vh - 220px);min-height:240px;overflow:auto;border:1px solid var(--border-color);border-radius:14px;background:var(--card-bg);overscroll-behavior:contain}
.orders-table{width:100%;min-width:1180px;border-collapse:separate;border-spacing:0;text-align:left;font-size:13px}
.orders-table th{position:sticky;top:0;z-index:2;padding:12px 11px;background:var(--card-bg);color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border-color);white-space:nowrap}
.orders-table td{padding:12px 11px;vertical-align:top;border-bottom:1px solid var(--border-color);line-height:1.45}
.orders-table tbody tr:last-child td{border-bottom:0}
.orders-table tbody tr:hover{background:var(--neon-glow)}
.table-scroll.is-selecting .orders-table tbody tr{cursor:pointer}
.orders-table td.order-item{min-width:180px;font-weight:700}
.orders-table td.address-cell,.orders-table td.comment-cell{min-width:170px;max-width:240px;overflow-wrap:anywhere}
.orders-table td.phone-cell{white-space:nowrap}
.orders-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--neon);cursor:pointer}
.order-status{display:inline-flex;padding:4px 8px;border-radius:7px;background:var(--neon-glow);color:var(--neon-dark);font-size:11px;font-weight:700;white-space:nowrap}
.order-status.status-cancelled{background:rgba(239,68,68,.12);color:#dc2626}
.order-status.status-delivered{background:rgba(16,185,129,.13);color:#059669}
.order-status.status-in_transit{background:rgba(14,165,233,.14);color:#0284c7}
.order-total{font-weight:800;white-space:nowrap}
.table-state{padding:48px 20px;text-align:center;color:var(--text-muted)}
.toast{position:fixed;right:20px;bottom:72px;z-index:200;max-width:min(440px,calc(100vw - 32px));padding:13px 18px;border:1px solid var(--border-color);border-radius:12px;background:var(--card-bg);color:var(--text-main);box-shadow:0 10px 30px rgba(0,0,0,.16);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.visible{opacity:1;transform:translateY(0)}
@media(max-width:900px){.site-header{padding:12px 16px}.logo{font-size:18px;gap:10px}.logo-icon{width:36px;height:36px}}
@media(max-width:600px){.page-heading{align-items:flex-start;flex-direction:column}.bulk-toolbar{align-items:stretch}.selection-summary{width:100%;justify-content:space-between;margin:0}.bulk-toolbar select,.apply-status{width:100%}.orders-table th{top:0}}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('site-theme')==='dark'?'dark':'light'}catch(e){}</script>

<main class="manage-page">
    <div class="page-heading"><div><h1>Заказы мне</h1><p>Отмечайте заказы и меняйте их статус группой.</p></div><button class="export-btn" id="exportExcel" type="button" title="Скачать таблицу в формате CSV для Excel"><span class="excel-mark" aria-hidden="true">X</span>Скачать Excel</button></div>
    <section class="bulk-toolbar" aria-label="Массовое изменение статуса">
        <div class="selection-summary"><span class="selection-count" id="selectionCount">Выбрано: 0</span><button class="clear-selection" id="clearSelection" type="button">Сбросить</button></div>
        <select id="bulkStatus" aria-label="Новый статус для выбранных заказов">
            <option value="">Выберите новый статус</option>

            </tr></thead>

        </table>
    </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
    'use strict';
    var orders=[];
    var tbody=document.getElementById('ordersTableBody');
    var selectAll=document.getElementById('selectAll');
    var bulkStatus=document.getElementById('bulkStatus');
    var applyButton=document.getElementById('applyStatus');
    var selectionCount=document.getElementById('selectionCount');
    var clearSelection=document.getElementById('clearSelection');
    var toastTimer;
    var selectionMode=false;
    var statusNames={new:'Ожидает',pending:'Ожидает',confirmed:'Подтверждён',cooking:'Готовится',ready:'Готово',in_transit:'В пути',delivered:'Доставлен',cancelled:'Отменён'};
    function text(value){return value===null||value===undefined||value===''?'—':String(value)}
    function toast(message){var el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('visible')},3200)}
    function formatDate(value){if(!value)return '—';var date=new Date(String(value).replace(' ','T'));return Number.isNaN(date.getTime())?String(value):new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(date)}
    function selectedIds(){return Array.from(tbody.querySelectorAll('.order-select:checked')).map(function(box){return Number(box.value)}).filter(Boolean)}
    function updateSelection(){var boxes=Array.from(tbody.querySelectorAll('.order-select'));var selected=boxes.filter(function(box){return box.checked}).length;selectionCount.textContent='Выбрано: '+selected;applyButton.disabled=selected===0||!bulkStatus.value;selectAll.checked=boxes.length>0&&selected===boxes.length;selectAll.indeterminate=selected>0&&selected<boxes.length;document.querySelector('.table-scroll').classList.toggle('is-selecting',selectionMode)}
    function render(){
        tbody.replaceChildren();
        if(!orders.length){var row=document.createElement('tr');var cell=document.createElement('td');cell.colSpan=11;cell.className='table-state';cell.textContent='Заказов пока нет';row.appendChild(cell);tbody.appendChild(row);updateSelection();return}
        orders.forEach(function(order){
            var row=document.createElement('tr');
            var selectCell=document.createElement('td');var checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.className='order-select';checkbox.value=String(Number(order.id));checkbox.setAttribute('aria-label','Выбрать заказ №'+order.id);checkbox.addEventListener('change',function(){selectionMode=true;updateSelection()});selectCell.appendChild(checkbox);row.appendChild(selectCell);
            var statusKey=statusNames[order.status]?String(order.status):'';
            var values=[
                ['#'+text(order.id),''],[formatDate(order.created_at),''],[text(order.dish_title),'order-item'],
                ['×'+text(order.quantity),''],[text(order.buyer_name),''],[text(order.buyer_phone),'phone-cell'],
                [text(order.delivery_address),'address-cell'],[text(order.comment),'comment-cell'],
                [Number(order.total_price||0).toLocaleString('ru-RU')+' ₽','order-total']
            ];
            values.forEach(function(entry){var cell=document.createElement('td');cell.textContent=entry[0];if(entry[1])cell.className=entry[1];row.appendChild(cell)});
            var statusCell=document.createElement('td');var badge=document.createElement('span');badge.className='order-status'+(statusKey?' status-'+statusKey:'');badge.textContent=statusNames[order.status]||text(order.status);statusCell.appendChild(badge);row.appendChild(statusCell);
            bindRowSelection(row,checkbox);
            tbody.appendChild(row);
        });
        updateSelection();
    }
    function bindRowSelection(row,checkbox){
        var holdTimer=null,startX=0,startY=0,longPressTriggered=false;
        row.addEventListener('pointerdown',function(event){
            if(event.button!==undefined&&event.button!==0)return;
            if(event.target.closest('input,button,a,select,textarea'))return;
            startX=event.clientX;startY=event.clientY;longPressTriggered=false;
            clearTimeout(holdTimer);
            holdTimer=window.setTimeout(function(){
                selectionMode=true;checkbox.checked=true;longPressTriggered=true;updateSelection();
                if(navigator.vibrate)navigator.vibrate(25);
            },300);
        });
        row.addEventListener('pointermove',function(event){
            if(Math.abs(event.clientX-startX)>10||Math.abs(event.clientY-startY)>10)clearTimeout(holdTimer);
        });
        ['pointerup','pointercancel','pointerleave'].forEach(function(name){row.addEventListener(name,function(){clearTimeout(holdTimer)})});
        row.addEventListener('contextmenu',function(event){event.preventDefault()});
        row.addEventListener('click',function(event){
            if(longPressTriggered){longPressTriggered=false;event.preventDefault();event.stopPropagation();return}
            if(!selectionMode||event.target.closest('input,button,a,select,textarea'))return;
            checkbox.checked=!checkbox.checked;updateSelection();
        });
    }
    async function loadOrders(){
        try{
            var response=await fetch('/api/orders.php?role=seller',{credentials:'include'});
            var data=await response.json();
            if(response.status===401)throw new Error('Войдите в аккаунт продавца, чтобы увидеть заказы. Вернитесь в профиль и авторизуйтесь.');
            if(!response.ok||!data.success)throw new Error(data.error||'Не удалось загрузить заказы');
            orders=Array.isArray(data.orders)?data.orders:[];
            render();
        }catch(error){tbody.innerHTML='';var row=document.createElement('tr');var cell=document.createElement('td');cell.colSpan=11;cell.className='table-state';cell.textContent=error.message||'Не удалось загрузить заказы';row.appendChild(cell);tbody.appendChild(row)}
    }
    function csvCell(value){var cell=String(value===null||value===undefined?'':value);if(/^[=+\-@\t\r]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"'}
    function exportExcel(){
        if(!orders.length){toast('Нет заказов для выгрузки');return}
        var columns=[
            ['Номер заказа',function(o){return o.id}],['Дата',function(o){return o.created_at}],
            ['Блюдо',function(o){return o.dish_title}],['Количество',function(o){return o.quantity}],
            ['Покупатель',function(o){return o.buyer_name}],['Телефон',function(o){return o.buyer_phone}],
            ['Адрес доставки',function(o){return o.delivery_address}],['Комментарий',function(o){return o.comment}],
            ['Сумма',function(o){return o.total_price}],['Статус',function(o){return statusNames[o.status]||o.status}]
        ];
        var lines=['sep=;',columns.map(function(c){return csvCell(c[0])}).join(';')];
        orders.forEach(function(order){lines.push(columns.map(function(c){return csvCell(c[1](order))}).join(';'))});
        var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
        var url=URL.createObjectURL(blob);var link=document.createElement('a');link.href=url;link.download='orders-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
    }
    selectAll.addEventListener('change',function(){selectionMode=selectAll.checked;tbody.querySelectorAll('.order-select').forEach(function(box){box.checked=selectAll.checked});updateSelection()});

    document.getElementById('exportExcel').addEventListener('click',exportExcel);
    applyButton.addEventListener('click',async function(){
        var ids=selectedIds();var status=bulkStatus.value;if(!ids.length||!status)return;
        applyButton.disabled=true;applyButton.textContent='Обновляем…';
        try{
            var response=await fetch('/api/update_orders_bulk.php',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_ids:ids,status:status})});
            var data=await response.json();
            if(!response.ok||!data.success)throw new Error(data.error||'Не удалось изменить статусы');
            toast(data.message||'Статусы заказов обновлены');bulkStatus.value='';selectionMode=false;selectAll.checked=false;await loadOrders();
        }catch(error){toast(error.message||'Ошибка при обновлении заказов')}
        finally{applyButton.textContent='Применить к выбранным';updateSelection()}
    });
    loadOrders();
})();
