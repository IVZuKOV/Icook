<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подтверждение email — Я готовлю</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);color:#0f172a;padding:20px;}
.box{text-align:center;max-width:450px;padding:40px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(30,64,175,0.15);border:2px solid rgba(30,64,175,0.2);}
.icon{font-size:64px;margin-bottom:20px;}
h1{font-size:28px;font-weight:800;color:#1e3a8a;margin-bottom:12px;}
p{color:#475569;line-height:1.6;margin-bottom:24px;font-size:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 32px;border:2px solid var(--neon);border-radius:14px;background:transparent;color:var(--neon-dark);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:0.3s;}
.btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(30,64,175,0.6);}
.error{color:#ef4444;font-weight:600;}
.success{color:#10b981;font-weight:600;}
.loader{display:inline-block;width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#1e3a8a;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg);}}

.bottom-bar .catalog-btn,.bottom-bar .icon-btn,.bottom-bar .user-btn-wrap{width:40px;height:40px;background:transparent;border:none;border-radius:50%;box-shadow:none;}

.bottom-bar .user-btn-wrap{height:40px;min-width:40px;max-width:40px;}
.bottom-bar .user-btn-letter{border-radius:50%;background:transparent;}
.bottom-bar .catalog-btn svg,.bottom-bar .icon-btn svg{width:20px;height:20px;}


.bottom-bar button,.bottom-bar a{-webkit-tap-highlight-color:transparent;appearance:none;outline:0 !important;box-shadow:none !important;}

.bottom-bar .catalog-btn:active,.bottom-bar .icon-btn:active,.bottom-bar .fav-btn:active,.bottom-bar .logout-btn:active{background:var(--neon-glow);border-radius:50%;}
.bottom-bar .catalog-btn:focus,.bottom-bar .icon-btn:focus,.bottom-bar .fav-btn:focus,.bottom-bar .logout-btn:focus{background:var(--neon-glow);border-radius:50%;}


.bottom-bar .catalog-btn:active,.bottom-bar .icon-btn:active,.bottom-bar .fav-btn:active,.bottom-bar .user-btn-wrap:active,.bottom-bar .logout-btn:active{background:var(--neon-glow);border-radius:50%;}

</style>

<style>
/* Разрешение копирования и вставки на мобильных */
input, textarea, [contenteditable="true"], select {
    -webkit-user-select: text !important;
    -moz-user-select: text !important;
    -ms-user-select: text !important;
    user-select: text !important;
    -webkit-touch-callout: default !important;
}
/* Убираем user-select:none с интерактивных элементов */
button, .btn, a, label {
    -webkit-user-select: auto !important;
    user-select: auto !important;

</style>

<body>
<div class="box" id="content">
<div class="loader"></div>
<p>Проверяем ссылку...</p>
</div>
<script>
(async function(){
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const box = document.getElementById('content');

if(!token){
box.innerHTML = '<div class="icon">❌</div><h1>Ошибка</h1><p class="error">Ссылка недействительна</p><a href="index.html" class="btn">На главную</a>';
return;
}

try{
const res = await fetch('/api/verify_token.php?token='+token);
const data = await res.json();

if(data.error){
box.innerHTML = '<div class="icon">⚠️</div><h1>Ошибка</h1><p class="error">'+data.error+'</p><a href="index.html" class="btn">На главную</a>';
return;
}

box.innerHTML = '<div class="icon">✅</div><h1>Email подтверждён!</h1><p class="success">Теперь вы можете войти в аккаунт</p><a href="index.html" class="btn">Перейти ко входу</a>';
}catch(e){
box.innerHTML = '<div class="icon">❌</div><h1>Ошибка</h1><p class="error">Не удалось подключиться к серверу</p><a href="index.html" class="btn">На главную</a>';
}
})();
</script>
</body>
</html>
