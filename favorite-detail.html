<script>
(function(){
    const params=new URLSearchParams(location.search);
    const type=params.get('type');
    const id=params.get('id')||'';
    const container=document.getElementById('favoriteDetail');
    const validTypes=['dish','recipe','place'];
    const fallbackImages={dish:'/assets/images/default-dishes/noodles.jpg',recipe:'/assets/images/default-dishes/noodles.jpg'};
    function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el;}
    function section(title){const wrap=node('section','detail-section');wrap.appendChild(node('h2','',title));return wrap;}
    function safeExternalUrl(value){try{const url=new URL(value,location.origin);return ['http:','https:','mailto:','tel:'].includes(url.protocol)?url.href:''}catch(e){return ''}}
    function parseArray(value){if(Array.isArray(value))return value;if(typeof value==='string'){try{const parsed=JSON.parse(value);return Array.isArray(parsed)?parsed:[]}catch(e){return []}}return []}
    function imageUrl(path,fallback){return typeof path==='string'&&path.trim()?path:fallback}
    function makeMiniDishTile(dish){
        const link=document.createElement('a');
        link.href='favorite-detail.html?type=dish&id='+encodeURIComponent(dish.id);
        link.setAttribute('aria-label',dish.title+(Number(dish.discount_percent)>0?' — скидка '+Number(dish.discount_percent)+'%':''));
        const image=node('img');image.src=dish.image||fallbackImages.dish;image.alt=dish.title||'Блюдо';link.appendChild(image);
        const discount=Number(dish.discount_percent)||0;
        if(discount>0){const badge=node('span','dish-mini-discount','−'+discount+'%');link.appendChild(badge)}
        return link;
    }
    function formatCount(value){value=Number(value)||0;return value>=1000?(value/1000).toFixed(value>=10000?0:1).replace('.',',')+'К':String(value)}
    function sellerTenure(date){if(!date)return 'на сайте';var months=Math.max(0,Math.floor((Date.now()-new Date(date).getTime())/(30.4375*86400000)));return months<1?'менее месяца':months<12?months+' мес.':Math.floor(months/12)+' г.'+(months%12?' '+months%12+' мес.':'')}
    async function openDishChat(dishId,sellerName){
        if(!localStorage.getItem('user')){if(typeof window.openAuth==='function')window.openAuth();return}
        let box=document.getElementById('dishChatBox');
        if(!box){box=node('section','dish-chat-box');box.id='dishChatBox';box.innerHTML='<header><strong></strong><button type="button" aria-label="Закрыть">×</button></header><div class="dish-chat-messages"></div><form><textarea maxlength="2000" required placeholder="Ваше сообщение"></textarea><button class="detail-button">Отправить</button></form>';document.body.appendChild(box);box.querySelector('header button').onclick=function(){box.classList.remove('active')};}
        box.querySelector('header strong').textContent='Чат с '+sellerName;box.classList.add('active');
        const opened=await fetch('/api/dish_chat.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'open',dish_id:dishId})}).then(r=>r.json());
        if(!opened.success){alert(opened.error||'Чат недоступен');return}
        async function refresh(){const data=await fetch('/api/dish_chat.php?conversation_id='+opened.conversation_id).then(r=>r.json());if(!data.success)return;const messages=box.querySelector('.dish-chat-messages');messages.replaceChildren();data.messages.forEach(function(m){messages.appendChild(node('p','',m.sender_name+': '+m.message_text))});messages.scrollTop=messages.scrollHeight}
        await refresh();
        box.querySelector('form').onsubmit=async function(event){event.preventDefault();const area=this.querySelector('textarea');const result=await fetch('/api/dish_chat.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'send',conversation_id:opened.conversation_id,message:area.value})}).then(r=>r.json());if(result.success){area.value='';refresh()}else alert(result.error||'Не удалось отправить сообщение')};
    }
    function readCart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){return []}}
    function discountedDishPrice(item){return Math.round(Number(item.price)*(1-(Number(item.discount_percent)||0)/100)*100)/100}
    function formatDishMoney(value){return Number(value).toLocaleString('ru-RU',{maximumFractionDigits:2})}
    function renderSimilarDishPurchase(dish,area){
        const cart=readCart();
        const row=cart.find(function(entry){return String(entry.id)===String(dish.id)});
        function render(){
            area.replaceChildren();
            const current=readCart().find(function(entry){return String(entry.id)===String(dish.id)});
            if(!current||Number(current.qty)<1){
                const button=node('button','btn','В корзину');button.type='button';
                button.addEventListener('click',function(){
                    const items=readCart(),existing=items.find(function(entry){return String(entry.id)===String(dish.id)});
                    if(existing)existing.qty=(Number(existing.qty)||1)+1;
                    else items.push({id:Number(dish.id),name:dish.title||'',chef:dish.seller_name||'Повар',price:discountedDishPrice(dish),img:dish.image||'',qty:1});
                    writeCart(items);render();showCartToast(dish.title||'Блюдо');
                });
                area.appendChild(button);return;
            }
            const control=node('div','qty-control'),minus=node('button','qty-btn','−'),value=node('span','qty-val',String(current.qty)),plus=node('button','qty-btn','+');
            minus.type=plus.type='button';
            function change(delta){
                const items=readCart(),entry=items.find(function(item){return String(item.id)===String(dish.id)});
                if(!entry)return;
                entry.qty=(Number(entry.qty)||1)+delta;
                if(entry.qty<1){
                    writeCart(items.filter(function(item){return String(item.id)!==String(dish.id)}));
                    render();
                }else{
                    writeCart(items);
                    value.textContent=String(entry.qty);
                }
            }
            minus.addEventListener('click',function(){change(-1)});plus.addEventListener('click',function(){change(1)});
            control.append(minus,value,plus);area.appendChild(control);
        }
        if(row&&Number(row.qty)>0)render();
        else render();
    }
    function makeSimilarDishCard(dish){
        const card=node('article','card content-detail-card');
        card.dataset.detailType='dish';card.dataset.detailId=String(dish.id);
        const image=node('img');image.src=dish.image||fallbackImages.dish;image.alt=dish.title||'Блюдо';image.loading='lazy';
        const discount=Math.max(0,Math.min(90,Number(dish.discount_percent)||0));
        const photo=node('div','dish-card-photo');photo.appendChild(image);
        if(discount>0)photo.appendChild(node('span','dish-discount-tile-badge','−'+discount+'%'));
        const favorite=node('button','fav-btn');favorite.type='button';favorite.dataset.id=String(dish.id);favorite.setAttribute('aria-label','Добавить в избранное');
        favorite.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
        if(window.isContentFavorite&&window.isContentFavorite('dish',dish.id))favorite.classList.add('active');
        favorite.addEventListener('click',function(event){event.preventDefault();event.stopPropagation();if(window.toggleContentFavorite)favorite.classList.toggle('active',window.toggleContentFavorite('dish',dish.id,dish));});
        const body=node('div','card-content');
        const titleLink=node('a','dish',dish.title||'Блюдо');titleLink.href='favorite-detail.html?type=dish&id='+encodeURIComponent(dish.id);titleLink.style.cssText='color:inherit;text-decoration:none';
        body.appendChild(titleLink);
        const chef=node('div','chef');chef.appendChild(window.IcookAuthorAvatar.create(dish.seller_name||'Повар',dish.seller_avatar,dish.seller_avatar_version,dish.seller_avatar_crop));chef.appendChild(node('span','',dish.seller_name||'Повар'));body.appendChild(chef);
        const description=node('div','desc',String(dish.description||'').slice(0,80));body.appendChild(description);
        const weightValue=dish.weight==null?'':String(dish.weight).trim();
        const weight=weightValue?' · '+(/[a-zа-я]/i.test(weightValue)?weightValue:weightValue+' г'):'';
        const price=node('div','price card-purchase-info'+(discount?' price-discount-row':''));
        if(discount)price.append(node('span','price-original',formatDishMoney(dish.price)+' ₽'),node('span','price-discounted',formatDishMoney(discountedDishPrice(dish))+' ₽'),document.createTextNode(weight));
        else price.textContent=formatDishMoney(dish.price)+' ₽'+weight;
        const area=node('div','card-purchase-area'),cartControl=node('div','similar-dish-cart-control');area.append(price,cartControl);renderSimilarDishPurchase(dish,cartControl);body.appendChild(area);
        card.append(favorite,photo,body);
        return card;
    }
    function writeCart(cart){localStorage.setItem('cart',JSON.stringify(cart));if(typeof window.updateCartBadge==='function')window.updateCartBadge()}
    function showCartToast(name){if(typeof window.showToast==='function')window.showToast(name+' добавлен в корзину')}
    function makeCartButton(item){
        const button=node('button','detail-button cart-add-btn','В корзину');
        button.type='button';
        button.addEventListener('click',function(){
            const cart=readCart();
            const existing=cart.find(function(row){return String(row.id)===String(item.id)});
            if(existing)existing.qty=(Number(existing.qty)||1)+1;
            else cart.push({id:Number(item.id),name:item.title||'',chef:item.seller_name||'Повар',price:discountedDishPrice(item),img:item.image||'',qty:1});
            writeCart(cart);
            showCartToast(item.title||'Блюдо');
            button.replaceWith(renderCartQuantity(item));
        });
        return button;
    }
    function renderCartQuantity(item){
        const old=document.getElementById('detailCartControl');
        if(old)old.remove();
        const cart=readCart();
        const inCart=cart.find(function(row){return String(row.id)===String(item.id)});
        if(!inCart||Number(inCart.qty)<1)return;
        const control=node('div','qty-control detail-qty-control');
        control.id='detailCartControl';
        const minus=node('button','qty-btn','−');
        minus.type='button';minus.setAttribute('aria-label','Уменьшить количество');
        const value=node('span','qty-val',String(inCart.qty));
        const plus=node('button','qty-btn','+');
        plus.type='button';plus.setAttribute('aria-label','Увеличить количество');
        minus.addEventListener('click',function(){
            const rows=readCart();
            const row=rows.find(function(entry){return String(entry.id)===String(item.id)});
            if(!row)return;
            row.qty=(Number(row.qty)||1)-1;
            if(row.qty<=0){
                writeCart(rows.filter(function(entry){return String(entry.id)!==String(item.id)}));
                control.replaceWith(makeCartButton(item));
            }else{
                writeCart(rows);value.textContent=String(row.qty);
            }
        });
        plus.addEventListener('click',function(){
            const rows=readCart();
            const row=rows.find(function(entry){return String(entry.id)===String(item.id)});
            if(!row)return;
            row.qty=(Number(row.qty)||1)+1;writeCart(rows);value.textContent=String(row.qty);
            showCartToast(item.title||'Блюдо');
        });
        control.append(minus,value,plus);
        return control;
    }
    function addHeader(item,label){
        const body=node('div','detail-body');
        body.appendChild(node('div','detail-kind',label));
        body.appendChild(node('h1','detail-title',item.title||item.name||'Подробнее'));
        return body;
    }
    function createFavoriteButton(item){
        const favorite=node('button','detail-favorite-btn');
        favorite.type='button';
        favorite.setAttribute('aria-label','Добавить в избранное');
        favorite.setAttribute('aria-pressed','false');
        favorite.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
        function syncFavoriteState(active){
            favorite.classList.toggle('active',active);
            favorite.setAttribute('aria-pressed',active?'true':'false');
            favorite.setAttribute('aria-label',active?'Удалить из избранного':'Добавить в избранное');
            favorite.title=active?'Удалить из избранного':'Добавить в избранное';
        }
        syncFavoriteState(window.isContentFavorite(type,id));
        favorite.addEventListener('click',function(){
            syncFavoriteState(window.toggleContentFavorite(type,id,item));
        });
        document.addEventListener('favoritecontentchange',function(event){
            if(event.detail&&event.detail.type===type&&String(event.detail.id)===id){
                syncFavoriteState(event.detail.added);
            }
        });
        return favorite;
    }
    function renderDish(item,detailData){
        const body=addHeader(item,'Блюдо');
        const author=node('div','detail-author');
        author.appendChild(window.IcookAuthorAvatar.create(item.seller_name||'Повар',item.seller_avatar,item.seller_avatar_version,item.seller_avatar_crop));
        author.appendChild(node('span','',item.seller_name||'Повар'));
        body.appendChild(author);
        const meta=node('div','detail-meta');
        if(item.category_name)meta.appendChild(node('span','',item.category_name));
        if(item.weight)meta.appendChild(node('span','',String(item.weight)));
        if(Number(item.discount_percent)>0)meta.appendChild(node('span','',item.discount_percent+'% скидка'));
        if(Number(item.price)>0){
            const discount=Number(item.discount_percent)||0;
            const priceGroup=node('div','detail-price-group');
            if(discount>0)priceGroup.appendChild(node('span','price-original',formatDishMoney(item.price)+' ₽'));
            priceGroup.appendChild(node('span',discount>0?'price-discounted':'',formatDishMoney(discountedDishPrice(item))+' ₽'));
            meta.appendChild(priceGroup);
        }
        body.appendChild(meta);
        body.appendChild(node('div','detail-description',item.description||'Подробное описание блюда пока не добавлено.'));
        const actions=node('div','detail-actions');
        if(Number(item.price)>0){const cart=readCart();const existing=cart.find(function(row){return String(row.id)===String(item.id)});actions.appendChild(existing&&Number(existing.qty)>0?renderCartQuantity(item):makeCartButton(item))}
        if(actions.childElementCount)body.appendChild(actions);
        const tabs=node('nav','dish-detail-tabs');
        const panels=node('div','dish-detail-panels');
        const tabData=[
            ['description','Описание',item.description||'Описание пока не добавлено.'],
            ['specs','Характеристики',(item.weight?'Вес: '+item.weight+'\n':'')+'Состав: '+(item.ingredients||[]).map(function(i){return i.name+' — '+i.amount_grams+' г'}).join(', ')+'\nЭнергетическая ценность: '+(item.nutrition?item.nutrition.energy_kj_per_100g+' кДж на 100 г':'не указана')]
        ];
        const reviewsPanel=node('section','dish-tab-panel');
        (detailData.reviews||[]).forEach(function(review){reviewsPanel.appendChild(node('article','dish-review',review.buyer_name+' · '+'★'.repeat(Number(review.rating))+'\n'+review.review_text))});
        if(!reviewsPanel.childElementCount)reviewsPanel.appendChild(node('p','', 'Пока нет отзывов от покупателей.'));
        const reviewForm=node('form','dish-review-form');
        reviewForm.innerHTML='<label class="dish-review-label">Ваша оценка<input type="hidden" name="rating" value="5"><button class="dish-rating-select" type="button" aria-haspopup="dialog" aria-controls="dishRatingModal"><span class="dish-rating-selected"><span class="dish-rating-stars">★★★★★</span> — Отлично</span><span aria-hidden="true">⌄</span></button></label><div class="dish-rating-overlay" id="dishRatingModal" role="presentation"><section class="dish-rating-modal" role="dialog" aria-modal="true" aria-label="Выберите оценку"><h3>Выберите оценку</h3><div class="dish-rating-options"><button class="dish-rating-option" type="button" data-rating="5"><span class="dish-rating-stars">★★★★★</span><span>Отлично</span></button><button class="dish-rating-option" type="button" data-rating="4"><span class="dish-rating-stars">★★★★☆</span><span>Хорошо</span></button><button class="dish-rating-option" type="button" data-rating="3"><span class="dish-rating-stars">★★★☆☆</span><span>Нормально</span></button><button class="dish-rating-option" type="button" data-rating="2"><span class="dish-rating-stars">★★☆☆☆</span><span>Плохо</span></button><button class="dish-rating-option" type="button" data-rating="1"><span class="dish-rating-stars">★☆☆☆☆</span><span>Очень плохо</span></button></div></section></div><textarea name="review_text" minlength="10" maxlength="2000" required placeholder="Расскажите о блюде (10–2000 символов)"></textarea><button class="detail-button" type="submit">Оставить отзыв</button><small>Отзыв доступен покупателям после получения заказа.</small>';
        const ratingOverlay=reviewForm.querySelector('.dish-rating-overlay');
        const ratingButton=reviewForm.querySelector('.dish-rating-select');
        ratingButton.addEventListener('click',function(){ratingOverlay.classList.add('active');ratingOverlay.querySelector('.dish-rating-option').focus()});
        ratingOverlay.addEventListener('click',function(event){if(event.target===ratingOverlay)ratingOverlay.classList.remove('active')});
        ratingOverlay.querySelectorAll('.dish-rating-option').forEach(function(option){option.addEventListener('click',function(){reviewForm.elements.rating.value=option.dataset.rating;const stars=option.querySelector('.dish-rating-stars').textContent;const label=option.lastElementChild.textContent;reviewForm.querySelector('.dish-rating-selected').innerHTML='<span class="dish-rating-stars">'+stars+'</span> — '+label;ratingOverlay.classList.remove('active');ratingButton.focus()})});
        reviewForm.addEventListener('submit',async function(event){event.preventDefault();try{const response=await fetch('/api/dish_reviews.php?dish_id='+encodeURIComponent(item.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating:reviewForm.elements.rating.value,review_text:reviewForm.elements.review_text.value})});const result=await response.json();if(!result.success)throw new Error(result.error||'Не удалось отправить отзыв');reviewForm.reset();reviewForm.appendChild(node('p','','Спасибо! Отзыв опубликован.'));}catch(error){alert(error.message)}});
        reviewsPanel.appendChild(reviewForm);
        tabData.forEach(function(tab,index){
            const button=node('button','dish-detail-tab'+(index===0?' active':''),tab[1]);button.type='button';tabs.appendChild(button);
            const panel=node('div','dish-tab-panel'+(index===0?' active':''),tab[2]);panels.appendChild(panel);
            button.addEventListener('click',function(){tabs.querySelectorAll('button').forEach(function(b){b.classList.remove('active')});panels.querySelectorAll('.dish-tab-panel').forEach(function(p){p.classList.remove('active')});button.classList.add('active');panel.classList.add('active')});
        });
        const reviewTab=node('button','dish-detail-tab','Отзывы');reviewTab.type='button';tabs.appendChild(reviewTab);panels.appendChild(reviewsPanel);
        reviewTab.addEventListener('click',function(){tabs.querySelectorAll('button').forEach(function(b){b.classList.remove('active')});panels.querySelectorAll('.dish-tab-panel').forEach(function(p){p.classList.remove('active')});reviewTab.classList.add('active');reviewsPanel.classList.add('active')});
        body.append(tabs,panels);
        const seller=detailData.seller||{};
        const sellerCard=node('section','dish-seller-card');
        sellerCard.appendChild(node('h2','', 'Продавец'));
        sellerCard.appendChild(node('strong','',seller.name||item.seller_name||'Повар'));
        sellerCard.appendChild(node('p','', '★ '+Number(seller.rating||0).toFixed(1)+' · '+formatCount(seller.reviews_count)+' отзывов · '+formatCount(seller.orders_count)+' заказов'));
        sellerCard.appendChild(node('small','', 'На IC '+sellerTenure(seller.created_at)));
        const chatButton=node('button','detail-button secondary','Написать продавцу');chatButton.type='button';
        chatButton.addEventListener('click',function(){openDishChat(item.id,seller.name||item.seller_name)});
        sellerCard.appendChild(chatButton);sellerCard.classList.add('dish-separated-card');
        const similar=node('section','similar-dishes-section');similar.appendChild(node('h2','', 'Похожие блюда'));
        const grid=node('div','cards cols-2 similar-dishes-grid');
        (detailData.similar||[]).forEach(function(d){grid.appendChild(makeSimilarDishCard(d))});
        similar.appendChild(grid);
        item._chefDishes=detailData.chef_dishes||[];
        renderCard(item,body,'dish');
        const mainCard=node('div','detail-card');
        mainCard.append.apply(mainCard,Array.from(container.childNodes));
        container.className='dish-detail-layout';
        container.replaceChildren(mainCard,sellerCard,similar);
    }
    function renderRecipe(item){
        const body=addHeader(item,'Рецепт');
        const author=node('div','detail-author');
        author.appendChild(window.IcookAuthorAvatar.create(item.author_name||'Автор',item.author_avatar,item.author_avatar_version,item.author_avatar_crop));
        author.appendChild(node('span','',item.author_name||'Автор'));body.appendChild(author);
        if(item.category_name)body.appendChild(node('div','detail-meta')).appendChild(node('span','',item.category_name));
        body.appendChild(node('div','detail-description',item.description||'Подробное описание рецепта пока не добавлено.'));
        const ingredients=parseArray(item.ingredients);
        if(ingredients.length){const block=section('Ингредиенты');const list=node('ul','detail-list');ingredients.forEach(function(ingredient){const name=typeof ingredient==='string'?ingredient:[ingredient.name,ingredient.qty,ingredient.unit].filter(Boolean).join(' ');if(name)list.appendChild(node('li','',name))});block.appendChild(list);body.appendChild(block)}
        const steps=parseArray(item.steps);
        if(steps.length){const block=section('Приготовление');steps.forEach(function(step,index){const row=node('article','recipe-step');row.appendChild(node('span','recipe-step-number',String(index+1)));row.appendChild(node('div','recipe-step-text',step.text||step.description||''));const pictures=Array.isArray(step.images)?step.images:(step.image?[step.image]:[]);pictures.forEach(function(path){if(typeof path!=='string'||!path)return;const pic=node('img');pic.src=path;pic.alt='Фото шага '+(index+1);pic.loading='lazy';row.appendChild(pic)});block.appendChild(row)});body.appendChild(block)}
        renderCard(item,body,'recipe');
    }
    function renderPlace(item){
        const body=addHeader(item,'Место');
        const meta=node('div','detail-meta');
        if(item.type)meta.appendChild(node('span','',item.type));
        if(item.distance)meta.appendChild(node('span','',item.distance));
        if(meta.childElementCount)body.appendChild(meta);
        if(item.address)body.appendChild(node('div','detail-description','Адрес: '+item.address));
        const actions=node('div','detail-actions');
        [['website','Открыть сайт'],['phone','Позвонить'],['email','Написать']].forEach(function(pair){const url=item[pair[0]]?safeExternalUrl(pair[0]==='phone'?'tel:'+item[pair[0]]:pair[0]==='email'?'mailto:'+item[pair[0]]:item[pair[0]]):'';if(url){const link=node('a','detail-button secondary',pair[1]);link.href=url;link.target=/^https?:/.test(url)?'_blank':'';if(link.target)link.rel='noopener noreferrer';actions.appendChild(link)}});
        if(item.address){const map=node('a','detail-button secondary','На карте');map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(item.address);map.target='_blank';map.rel='noopener noreferrer';actions.appendChild(map)}
        body.appendChild(actions);
        renderCard(item,body,'place');
    }
    function renderCard(item,body,kind){
        container.replaceChildren();
        const src=imageUrl(item.image,kind==='place'&&window.IcookDefaultPlaceImage?window.IcookDefaultPlaceImage.random():(fallbackImages[kind]||''));
        if(src){const picture=node('img','detail-image');picture.src=src;picture.alt=item.title||item.name||'';picture.onerror=function(){this.onerror=null;if(fallbackImages[kind])this.src=fallbackImages[kind];else this.remove()};picture.loading='eager';container.appendChild(picture)}
        if(kind==='dish'&&Number(item.discount_percent)>0){const badge=node('span','dish-discount-badge','−'+Number(item.discount_percent)+'%');container.appendChild(badge)}
        if(kind==='dish'&&Array.isArray(item._chefDishes)&&item._chefDishes.length){const gallery=node('div','dish-mini-strip dish-chef-strip');item._chefDishes.forEach(function(d){gallery.appendChild(makeMiniDishTile(d))});container.appendChild(gallery)}
        container.appendChild(createFavoriteButton(item));
        container.appendChild(body);
    }
    async function load(){
        if(!validTypes.includes(type)||!id){container.innerHTML='<div class="detail-state">Не удалось определить избранный материал.</div>';return}
        const entry=window.getFavoriteContent().find(function(row){return row.type===type&&String(row.id)===id});
        try{
            if(type==='place'){
                let placeItem=null;
                try{placeItem=JSON.parse(sessionStorage.getItem('icook-place-detail-'+id)||'null');sessionStorage.removeItem('icook-place-detail-'+id)}catch(e){}
                if(!placeItem)placeItem=entry&&entry.item;
                if(!placeItem)throw new Error('Не удалось загрузить информацию о месте.');
                renderPlace(placeItem);document.title=(placeItem.name||'Подробнее')+' — Я готовлю — ты ешь!';return;
            }
            const endpoint=type==='dish'?'/api/dishes.php?ids=':'/api/recipes.php?ids=';
            const response=await fetch(type==='dish'?'/api/dish_detail.php?id='+encodeURIComponent(id):endpoint+encodeURIComponent(id),{cache:'no-store'});
            if(!response.ok)throw new Error('Не удалось загрузить подробную информацию.');
            const data=await response.json();
            const list=type==='dish'?[data.dish]:data.recipes;
            const item=Array.isArray(list)&&list[0];
            if(!data.success||!item)throw new Error('Материал не найден или больше недоступен.');
            type==='dish'?renderDish(item,data):renderRecipe(item);
            document.title=(item.title||'Подробнее')+' — Я готовлю — ты ешь!';
        }catch(error){container.innerHTML='';container.appendChild(node('div','detail-state',error.message||'Не удалось загрузить материал.'))}
    }
    load();
})();
