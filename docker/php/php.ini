; ---------------------------------------------------------------------------
; iCook — настройки PHP (профиль разработки)
; ---------------------------------------------------------------------------
date.timezone = UTC

memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
max_input_vars = 5000

; Для отладки в dev: показываем все ошибки
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Безопасность сессий
session.cookie_httponly = On
